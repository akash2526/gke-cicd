steps:
  # Build image for app1
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/dev-env-505906/gke-repo/quickstart-image'
      - './app1'
    id: 'Build Docker Image'

  # Push app1 image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/dev-env-505906/gke-repo/quickstart-image'
    id: 'Push Docker Image'

  # Build image for app2
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/dev-env-505906/gke-repo/flask-image'
      - './app2'
    id: 'Build Docker Image2'

  # Push app2 image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/dev-env-505906/gke-repo/flask-image'
    id: 'Push Docker Image2'

  # Configure Cloud Deploy and create a release
  - name: 'google/cloud-sdk:latest'
    entrypoint: 'sh'
    args:
      - '-xe'
      - '-c'
      - |
        gcloud deploy apply --file=deploy/dev.yaml --region=us-central1 --project=dev-env-505906
        gcloud deploy apply --file=deploy/pipeline.yaml --region=us-central1 --project=dev-env-505906
        gcloud deploy releases create app-release-${SHORT_SHA} --delivery-pipeline=gke-cicd-pipeline --region=us-central1 --project=dev-env-505906 --source=. --skaffold-file=skaffold.yaml

options:
  logging: CLOUD_LOGGING_ONLY